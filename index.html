
<!DOCTYPE html>
<html>
<head>
    <title>Jenkins Deployment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DEV to TEST Deployment</h1>

    <div class="box">
        <h2>DEV Environment</h2>
        <p>Write Code</p>
    </div>

    <h2 class="arrow">↓</h2>

    <div class="box">
        <h2>GitHub</h2>
        <p>Push Code</p>
    </div>

    <h2 class="arrow">↓</h2>

    <div class="box">
        <h2>Jenkins</h2>
        <p>Build and Test</p>
    </div>

    <h2 class="arrow">↓</h2>

    <div class="box">
        <h2>TEST Environment</h2>
        <p>Deploy and Verify</p>
    </div>

</body>
</html>
